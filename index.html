<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfólio · Gko</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#07090f;font-family:sans-serif}
#pf-iframe{display:block;width:100%;height:100vh;border:none}
#pf-loader{
  position:fixed;inset:0;background:#07090f;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:1rem;color:#4fffb0;z-index:99;
  transition:opacity .5s
}
#pf-loader.hidden{opacity:0;pointer-events:none}
.pf-dot{width:10px;height:10px;border-radius:50%;background:#4fffb0;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.pf-label{font-size:.8rem;color:#5d7a9b}
</style>
</head>
<body>

<div id="pf-loader">
  <div class="pf-dot"></div>
  <div class="pf-label">carregando portfólio...</div>
</div>

<iframe id="pf-iframe" src="about:blank" title="Portfólio Gko"></iframe>

<script>
(function(){
  var TUNNEL  = 'https://ought-facing-village-pursue.trycloudflare.com';
  var GHBASE  = window.location.origin + window.location.pathname.replace(/\/+$/, '');
  var params  = new URLSearchParams(window.location.search);
  var page    = params.get('page');
  var project = params.get('project');
  var file    = params.get('file') || 'index.php';

  // ── Monta destino no tunnel ──────────────────────────────
  var base = TUNNEL.replace(/\/+$/, '');
  var dest;

  if (project) {
    dest = base + '/project.php?project=' + encodeURIComponent(project)
         + '&file=' + encodeURIComponent(file);
    // Repassa parâmetros extras (page=, action=, etc.)
    params.forEach(function(v, k){
      if (k !== 'project' && k !== 'file') dest += '&' + k + '=' + encodeURIComponent(v);
    });
  } else if (page === 'projects') {
    dest = base + '/projects.php';
  } else if (page === 'admin') {
    dest = base + '/admin/dashboard.php';
  } else {
    dest = base + '/';
    var extras = [];
    params.forEach(function(v, k){
      if (k !== 'page' && k !== 'project' && k !== 'file') extras.push(k + '=' + encodeURIComponent(v));
    });
    if (extras.length) dest += '?' + extras.join('&');
  }

  var iframe = document.getElementById('pf-iframe');
  var loader = document.getElementById('pf-loader');

  iframe.src = dest;
  iframe.onload = function(){ loader.classList.add('hidden'); };
  setTimeout(function(){ loader.classList.add('hidden'); }, 10000);

  // ── Sincroniza URL do GitHub com mensagens do iframe ────
  // O site dentro do iframe manda postMessage quando navega.
  // Isso funciona mesmo cross-origin (tunnel URL ≠ github.io).
  window.addEventListener('message', function(e) {
    // Aceita apenas mensagens do tunnel (qualquer origem, mas valida o tipo)
    var d = e.data;
    if (!d || typeof d !== 'object') return;

    if (d.type === 'pf-navigate') {
      // Clique em link: navega o iframe para a URL interna
      // e atualiza a barra de endereços para a URL do GitHub
      iframe.src = d.iframeSrc;
      history.replaceState(null, '', d.githubUrl);

    } else if (d.type === 'pf-urlchange') {
      // Mudança de URL interna (pushState/popState no site)
      history.replaceState(null, '', d.githubUrl);
    }
  });

  // Fallback: sync ao carregar o iframe (primeira carga)
  iframe.addEventListener('load', function() {
    try {
      var iparams = new URLSearchParams(iframe.contentWindow.location.search);
      var ipath   = iframe.contentWindow.location.pathname;
      var ghUrl   = GHBASE;
      if (iparams.has('project')) {
        ghUrl += '/?project=' + encodeURIComponent(iparams.get('project'));
        var f = iparams.get('file');
        if (f && f !== 'index.php') ghUrl += '&file=' + encodeURIComponent(f);
      } else if (ipath.includes('/projects.php')) {
        ghUrl += '/?page=projects';
      }
      if (ghUrl !== window.location.href) history.replaceState(null, '', ghUrl);
    } catch(e){ /* cross-origin na primeira carga — ok */ }
  });

})();
</script>

</body>
</html>
