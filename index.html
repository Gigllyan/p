<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfólio · Gko</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#07090f;font-family:sans-serif}
#pf-iframe{display:block;width:100%;height:100vh;border:none}
#pf-loader{
  position:fixed;inset:0;background:#07090f;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:1rem;color:#4fffb0;z-index:99;
  transition:opacity .5s
}
#pf-loader.hidden{opacity:0;pointer-events:none}
.pf-dot{width:10px;height:10px;border-radius:50%;background:#4fffb0;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.pf-label{font-size:.8rem;color:#5d7a9b}
</style>
</head>
<body>

<div id="pf-loader">
  <div class="pf-dot"></div>
  <div class="pf-label">carregando portfólio...</div>
</div>

<iframe id="pf-iframe" src="about:blank" title="Portfólio Gko"></iframe>

<script>
(function(){
  var TUNNEL  = 'https://marked-theaters-bless-bolt.trycloudflare.com';
  var GHBASE  = window.location.origin + window.location.pathname.replace(/\/+$/, '');
  var params  = new URLSearchParams(window.location.search);
  var page    = params.get('page');
  var project = params.get('project');
  var file    = params.get('file') || 'index.php';

  // ── Monta destino no tunnel ──────────────────────────────
  var base = TUNNEL.replace(/\/+$/, '');
  var dest;

  if (project) {
    dest = base + '/project.php?project=' + encodeURIComponent(project)
         + '&file=' + encodeURIComponent(file);
    // Repassa parâmetros extras (page=, action=, etc.)
    params.forEach(function(v, k){
      if (k !== 'project' && k !== 'file') dest += '&' + k + '=' + encodeURIComponent(v);
    });
  } else if (page === 'projects') {
    dest = base + '/projects.php';
  } else if (page === 'admin') {
    dest = base + '/admin/dashboard.php';
  } else {
    dest = base + '/';
    var extras = [];
    params.forEach(function(v, k){
      if (k !== 'page' && k !== 'project' && k !== 'file') extras.push(k + '=' + encodeURIComponent(v));
    });
    if (extras.length) dest += '?' + extras.join('&');
  }

  var iframe = document.getElementById('pf-iframe');
  var loader = document.getElementById('pf-loader');

  iframe.src = dest;
  iframe.onload = function(){ loader.classList.add('hidden'); };
  setTimeout(function(){ loader.classList.add('hidden'); }, 10000);

  // ── Sincroniza URL do GitHub com estado do iframe ────────
  // Usa polling (200ms) pois o iframe pode navegar internamente
  // sem disparar o evento 'load' (SPA, history.pushState, etc.)
  var lastSynced = '';

  function syncUrl() {
    try {
      var iparams = new URLSearchParams(iframe.contentWindow.location.search);
      var ipath   = iframe.contentWindow.location.pathname;
      var newParam = '';

      if (iparams.has('project')) {
        // Dentro de um projeto via proxy
        newParam = '?project=' + encodeURIComponent(iparams.get('project'));
        var f = iparams.get('file');
        if (f && f !== 'index.php') newParam += '&file=' + encodeURIComponent(f);
        // Preserva page= se existir (ex: ?page=login)
        if (iparams.has('page')) newParam += '&page=' + encodeURIComponent(iparams.get('page'));

      } else if (ipath.endsWith('/projects.php') || ipath.includes('/projects.php')) {
        newParam = '?page=projects';

      } else if (ipath.endsWith('/admin/dashboard.php') || ipath.includes('/admin/')) {
        newParam = '?page=admin';

      } else {
        // Página principal ou qualquer outra — remove params do GitHub
        newParam = '';
      }

      if (newParam !== lastSynced) {
        lastSynced = newParam;
        var newUrl = GHBASE + (newParam || window.location.search);
        if (newUrl !== window.location.href) {
          history.replaceState(null, '', newParam ? GHBASE + newParam : GHBASE);
        }
      }
    } catch(e){ /* cross-origin — ok, tunnel ainda carregando */ }
  }

  // Roda ao carregar + polling a cada 300ms
  iframe.addEventListener('load', syncUrl);
  setInterval(syncUrl, 300);

})();
</script>

</body>
</html>
