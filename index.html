<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Portfólio · Gko</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#07090f;font-family:sans-serif}
#pf-iframe{display:block;width:100%;height:100vh;border:none}
#pf-loader{
  position:fixed;inset:0;background:#07090f;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:1rem;color:#4fffb0;z-index:99;
  transition:opacity .5s
}
#pf-loader.hidden{opacity:0;pointer-events:none}
.pf-dot{width:10px;height:10px;border-radius:50%;background:#4fffb0;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.pf-label{font-size:.8rem;color:#5d7a9b}
/* tela offline */
#pf-offline{
  position:fixed;inset:0;background:#07090f;
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:1.2rem;color:#5d7a9b;z-index:99
}
#pf-offline.show{display:flex}
.pf-offline-icon{font-size:3rem}
.pf-offline-title{color:#c8d8e8;font-size:1.1rem;font-weight:600}
.pf-offline-sub{font-size:.8rem;text-align:center;max-width:260px;line-height:1.5}
.pf-retry{margin-top:.5rem;padding:.5rem 1.2rem;background:#1a2a3a;border:1px solid #2a4a6a;
  border-radius:6px;color:#4fffb0;cursor:pointer;font-size:.85rem}
.pf-retry:hover{background:#2a3a4a}
</style>
</head>
<body>

<div id="pf-loader">
  <div class="pf-dot"></div>
  <div class="pf-label">carregando portfólio...</div>
</div>

<div id="pf-offline">
  <div class="pf-offline-icon">📡</div>
  <div class="pf-offline-title">Servidor offline</div>
  <div class="pf-offline-sub">O portfólio está temporariamente indisponível. Tente novamente em alguns instantes.</div>
  <button class="pf-retry" onclick="window.init()">Tentar novamente</button>
</div>

<iframe id="pf-iframe" src="about:blank" title="Portfólio Gko"></iframe>

<script>
(function(){
  var GHBASE   = window.location.origin + window.location.pathname.replace(/\/+$/, '');
  var LINK_TXT = GHBASE + '/link.txt';
  // Tempo máximo (ms) esperando o iframe carregar antes de considerar offline
  var IFRAME_TIMEOUT = 12000;

  var iframe  = document.getElementById('pf-iframe');
  var loader  = document.getElementById('pf-loader');
  var offline = document.getElementById('pf-offline');
  var iframeTimer = null;

  function showOffline() {
    if (iframeTimer) { clearTimeout(iframeTimer); iframeTimer = null; }
    iframe.src = 'about:blank';
    loader.classList.add('hidden');
    offline.classList.add('show');
  }

  function showIframe(tunnel) {
    offline.classList.remove('show');

    var params  = new URLSearchParams(window.location.search);
    var page    = params.get('page');
    var project = params.get('project');
    var file    = params.get('file') || 'index.php';
    var base    = tunnel.replace(/\/+$/, '');
    var dest;

    if (project) {
      dest = base + '/project.php?project=' + encodeURIComponent(project)
           + '&file=' + encodeURIComponent(file);
      params.forEach(function(v,k){
        if (k!=='project'&&k!=='file') dest+='&'+k+'='+encodeURIComponent(v);
      });
    } else if (page === 'projects') {
      dest = base + '/projects.php';
    } else if (page === 'admin') {
      dest = base + '/admin/dashboard.php';
    } else {
      dest = base + '/';
      var extras=[];
      params.forEach(function(v,k){
        if(k!=='page'&&k!=='project'&&k!=='file') extras.push(k+'='+encodeURIComponent(v));
      });
      if(extras.length) dest+='?'+extras.join('&');
    }

    // Dispara timer: se o iframe não carregar em IFRAME_TIMEOUT ms → offline
    if (iframeTimer) clearTimeout(iframeTimer);
    iframeTimer = setTimeout(function() {
      // Verifica se o link.txt mudou enquanto aguardávamos (tunnel reconectou)
      fetch(LINK_TXT + '?_=' + Date.now(), { cache: 'no-store' })
        .then(function(r){ return r.text(); })
        .then(function(txt){
          var url = txt.trim();
          if (url && url !== 'offline' && url !== 'manutencao' && url.startsWith('http') && url !== tunnel) {
            // URL mudou — tunnel reconectou com novo endereço, tenta de novo
            showIframe(url);
          } else {
            showOffline();
          }
        })
        .catch(function(){ showOffline(); });
    }, IFRAME_TIMEOUT);

    iframe.onload = function() {
      // Iframe carregou — cancela o timer de timeout
      if (iframeTimer) { clearTimeout(iframeTimer); iframeTimer = null; }
      loader.classList.add('hidden');
    };

    iframe.src = dest;
  }

  // Sonda o tunnel antes de confiar na URL do link.txt
  // Usa um fetch com timeout curto para ver se o servidor responde
  function probeTunnel(url, callback) {
    var controller = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function() {
      if (controller) controller.abort();
      callback(false);
    }, 6000);

    var opts = { method: 'HEAD', mode: 'no-cors', cache: 'no-store' };
    if (controller) opts.signal = controller.signal;

    fetch(url, opts)
      .then(function() {
        clearTimeout(timer);
        callback(true);
      })
      .catch(function() {
        clearTimeout(timer);
        callback(false);
      });
  }

  window.init = function() {
    offline.classList.remove('show');
    loader.classList.remove('hidden');

    fetch(LINK_TXT + '?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(txt){
        var url = txt.trim();
        // link.txt explicitamente offline/manutenção
        if (!url || url === 'offline' || url === 'manutencao' || !url.startsWith('http')) {
          showOffline();
          return;
        }
        // URL parece válida — sonda o tunnel antes de carregar o iframe
        probeTunnel(url, function(alive) {
          if (alive) {
            showIframe(url);
          } else {
            // Tunnel não responde — mostra offline e agenda nova tentativa
            showOffline();
            // Tenta de novo automaticamente em 30s (tunnel pode estar reconectando)
            setTimeout(function() {
              if (offline.classList.contains('show')) window.init();
            }, 30000);
          }
        });
      })
      .catch(function(){ showOffline(); });
  };

  // Sincroniza URL do GitHub com mensagens do iframe
  window.addEventListener('message', function(e) {
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'pf-navigate') {
      iframe.src = d.iframeSrc;
      history.replaceState(null, '', d.githubUrl);
    } else if (d.type === 'pf-urlchange') {
      history.replaceState(null, '', d.githubUrl);
    }
  });

  iframe.addEventListener('load', function() {
    try {
      var iparams = new URLSearchParams(iframe.contentWindow.location.search);
      var ipath   = iframe.contentWindow.location.pathname;
      var ghUrl   = GHBASE;
      if (iparams.has('project')) {
        ghUrl += '/?project=' + encodeURIComponent(iparams.get('project'));
        var f = iparams.get('file');
        if (f && f !== 'index.php') ghUrl += '&file=' + encodeURIComponent(f);
      } else if (ipath.includes('/projects.php')) {
        ghUrl += '/?page=projects';
      }
      if (ghUrl !== window.location.href) history.replaceState(null, '', ghUrl);
    } catch(e){}
  });

  init();
})();
</script>
</body>
</html>
